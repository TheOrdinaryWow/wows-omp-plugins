name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Git ref to verify, e.g. the release PR branch
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint and catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run check-catalog

  test:
    name: Types and tests (omp ${{ matrix.omp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `locked` is the version in bun.lock; 18.2.7 is the oldest host jev-dispatch supports.
        omp: [locked, 18.2.7]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Install omp ${{ matrix.omp }}
        if: matrix.omp != 'locked'
        run: bun add --dev "@oh-my-pi/pi-coding-agent@${{ matrix.omp }}"
      - run: bun run check-types
      - run: bun run test
