name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5

  # Pushes made with GITHUB_TOKEN do not trigger other workflows, so the release PR
  # would otherwise carry no checks. Verify its branch here instead.
  verify-release-pr:
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
